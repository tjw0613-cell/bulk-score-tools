[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-score-tools"
version = "0.1.0"
description = "Fixed-score log-RNA corrections and reference-conditioned gene leakage diagnostics"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[tool.setuptools.packages.find]
include = ["bulk_score_tools*"]

[tool.setuptools.package-data]
bulk_score_tools = ["data/*.json", "data/*.npz"]

[project.urls]
Repository = "https://github.com/tjw0613-cell/bulk-score-tools"
"Study archive" = "https://doi.org/10.5281/zenodo.23886566"
